services:
  web:
    image: anex4real/task-tracker:v3
    restart: unless-stopped
    ports:
      - "8080:5000"
    env_file:
      - .env
    networks:
      - task-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - task-db-data:/var/lib/postgresql/data
    networks:
      - task-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  task-db-data:
    name: task-db-data

networks:
  task-network:
    name: task-network
